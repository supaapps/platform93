            application/json:
              schema:
                $ref: '#/components/schemas/Organization'
  /v1/management/organizations/{organization_id}:
    parameters:
      - $ref: '#/components/parameters/OrganizationID'
    get:
      operationId: managementGetOrganization
      tags:
        - Management
      security:
