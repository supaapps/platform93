                $ref: '#/components/schemas/EmptyResponse'
  /oidc/introspect:
    post:
      operationId: introspectOIDCToken
      tags:
        - Identity
      security: []
      requestBody:
        $ref: '#/components/requestBodies/OAuthTokenCredential'
      responses:
        '200':
          description: RFC 7662 token state
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenIntrospection'
  /oidc/userinfo:
    get:
