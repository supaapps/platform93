        schema:
          $ref: '#/components/schemas/UUID'
    patch:
      operationId: managementUpdateApplication
      tags:
        - Management
      security:
        - managementBearer: []
      parameters:
        - $ref: '#/components/parameters/IfMatch'
      requestBody:
        $ref: '#/components/requestBodies/Rename'
      responses:
        '204':
          description: Application renamed
    delete:
      operationId: managementRetireApplication
      tags:
        - Management
      security:
        - managementBearer: []
      responses:
        '204':
          description: Application retired
  /v1/management/organizations/{organization_id}/applications/{application_resource_id}/restore:
    parameters:
      - $ref: '#/components/parameters/OrganizationID'
      - name: application_resource_id
        in: path
        required: true
        schema:
          $ref: '#/components/schemas/UUID'
    post:
      operationId: managementRestoreApplication
      tags:
        - Management
      security:
        - managementBearer: []
      responses:
        '204':
          description: Application restored
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT-or-PAT
    controlBearer:
      type: http
      scheme: bearer
      bearerFormat: JWT
    controlCookie:
      type: apiKey
      in: cookie
      name: p93_control_access
    managementBearer:
      type: http
      scheme: bearer
      bearerFormat: Platform93-management-JWT
      description: Short-lived client-credentials token with actor_type=management_client and audience platform93:control.
  parameters:
    ApplicationID:
      name: application_id
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/UUID'
    WorkspaceID:
      name: workspace_id
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/UUID'
    ObjectID:
      name: object_id
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/UUID'
    ConfirmAffectedObjects:
      name: confirm_affected_objects
      in: query
      required: false
      schema:
        type: boolean
        default: false
      description: Required when disabling a provider pinned by live objects.
    ForceDelete:
      name: force
      in: query
      required: false
      schema:
        type: boolean
        default: false
      description: Break managed email-template references; requires X-Audit-Reason.
    WorkspaceIDQuery:
      name: workspace_id
      in: query
      required: false
      description: Explicit accessible workspace whose grants are merged with the current user's grants.
      schema:
        $ref: '#/components/schemas/UUID'
    PermissionSubjectType:
      name: subject_type
      in: query
      required: true
      schema:
        type: string
        enum:
          - user
          - client
    PermissionSubjectID:
      name: subject_id
      in: query
      required: true
      schema:
        $ref: '#/components/schemas/UUID'
    OrganizationID:
      name: organization_id
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/UUID'
    IncludeRetired:
      name: include_retired
      in: query
      schema:
        type: boolean
        default: false
    IfMatch:
      name: If-Match
      in: header
      required: true
      schema:
        type: string
      description: Current resource ETag.
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: false
      schema:
        type: string
        minLength: 8
        maxLength: 255
    RequiredIdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema:
        type: string
        minLength: 8
        maxLength: 255
    ProviderID:
      name: provider_id
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/UUID'
    SessionID:
      name: session_id
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/UUID'
    SubscriptionID:
      name: subscription_id
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/UUID'
    PaymentID:
      name: payment_id
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/UUID'
    RequestID:
      name: request_id
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/UUID'
    OAuthClientID:
      name: client_id
      in: query
      required: true
      schema:
        type: string
    OAuthRedirectURI:
      name: redirect_uri
      in: query
      required: true
      schema:
        type: string
        format: uri
    OAuthResponseType:
      name: response_type
      in: query
      required: true
      schema:
        type: string
        const: code
    OAuthScope:
      name: scope
      in: query
      required: true
      schema:
        type: string
    OAuthState:
      name: state
      in: query
      required: true
      schema:
        type: string
        minLength: 8
    OAuthCodeChallenge:
      name: code_challenge
      in: query
      required: true
      schema:
        type: string
        minLength: 43
        maxLength: 128
    OAuthCodeChallengeMethod:
      name: code_challenge_method
      in: query
      required: true
      schema:
        type: string
        const: S256
    OptionalPermissionSubjectType:
      name: subject_type
      in: query
      required: false
      schema:
        type: string
        enum:
          - user
          - client
    OptionalPermissionSubjectID:
      name: subject_id
      in: query
      required: false
      schema:
        $ref: '#/components/schemas/UUID'
    PermissionGrantStatus:
      name: status
      in: query
      required: false
      schema:
        type: string
        enum:
          - active
          - revoked
  requestBodies:
    Named:
      required: true
      content:
        application/json:
          schema:
            type: object
            required:
              - name
              - slug
            properties:
              name:
                type: string
              slug:
                type: string
                pattern: ^[a-z][a-z0-9-]{1,62}[a-z0-9]$
    Rename:
      required: true
      content:
        application/json:
          schema:
            type: object
            required:
              - name
            properties:
              name:
                type: string
                minLength: 1
                maxLength: 255
            additionalProperties: false
    ProviderInheritance:
      required: true
      content:
        application/json:
          schema:
            type: object
            required:
              - inheritable
            properties:
              inheritable:
                type: boolean
                description: Allow child scopes to resolve this provider.
            additionalProperties: false
    ApplicationAuthConfig:
      required: true
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApplicationAuthConfig'
    PublicApplicationConfig:
      required: true
      content:
        application/json:
          schema:
            type: object
            additionalProperties: true
            description: This entire object is returned by the unauthenticated runtime-config endpoint. Secrets are forbidden.
    InternalApplicationConfig:
      required: true
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApplicationInternalConfig'
    RoleAssignment:
      required: true
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/RoleAssignment'
    PermissionGrantBody:
      required: true
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/CreatePermissionGrant'
    OwnershipTransfer:
      required: true
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/OwnershipTransfer'
    SMTPProvider:
      required: true
      content:
        application/json:
          schema:
            type: object
            required:
              - name
              - host
              - port
              - tls_mode
              - sender_email
            properties:
              name:
                type: string
              host:
                type: string
              port:
                type: integer
                minimum: 1
                maximum: 65535
              username:
                type: string
              password:
                type: string
                writeOnly: true
              tls_mode:
                enum:
                  - starttls
                  - implicit_tls
              sender_email:
                type: string
                format: email
              sender_name:
                type: string
              inheritable:
                type: boolean
                default: false
    StorageProviderBody:
      required: true
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/CreateStorageProvider'
    StorageUpload:
      required: true
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/CreateStorageUpload'
    OAuthAuthorizationDecision:
      required: true
      content:
        application/x-www-form-urlencoded:
          schema:
            type: object
            required:
              - client_id
              - redirect_uri
              - response_type
              - scope
              - state
              - code_challenge
              - code_challenge_method
              - decision
            properties:
              client_id:
                type: string
              redirect_uri:
                type: string
                format: uri
              response_type:
                type: string
                const: code
              scope:
                type: string
              state:
                type: string
              nonce:
                type: string
              code_challenge:
                type: string
              code_challenge_method:
                type: string
                const: S256
              decision:
                enum:
                  - grant
                  - deny
    OAuthToken:
      required: true
      content:
        application/x-www-form-urlencoded:
          schema:
            type: object
            required:
              - grant_type
            properties:
              grant_type:
                enum:
                  - authorization_code
                  - refresh_token
                  - client_credentials
              code:
                type: string
              redirect_uri:
                type: string
                format: uri
              code_verifier:
                type: string
              refresh_token:
                type: string
              client_id:
                type: string
              client_secret:
                type: string
                writeOnly: true
              scope:
                type: string
    OAuthTokenCredential:
      required: true
      content:
        application/x-www-form-urlencoded:
          schema:
            type: object
            required:
              - token
            properties:
              token:
                type: string
                writeOnly: true
              token_type_hint:
                enum:
                  - access_token
                  - refresh_token
              client_id:
                type: string
              client_secret:
                type: string
                writeOnly: true
  responses:
    Problem:
      description: RFC 9457 problem
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Tokens:
      description: Rotating user session
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/TokenResponse'
    OwnershipTransferResult:
      description: Workspace ownership transferred atomically
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/OwnershipTransferResult'
  schemas:
    HealthStatus:
      type: object
      required:
        - status
      properties:
        status:
          type: string
          enum:
            - ok
            - ready
      additionalProperties: false
    VersionInfo:
      type: object
      required:
        - version
        - commit
        - built_at
        - schema
      properties:
        version:
          type: string
        commit:
          type: string
        built_at:
          type: string
        schema:
          type: string
      additionalProperties: false
    SetupStatus:
      type: object
      required:
        - available
        - control_user_email_login_available
        - control_auth_methods
      properties:
        available:
          type: boolean
        control_user_email_login_available:
          type: boolean
        control_auth_methods:
          $ref: '#/components/schemas/ControlAuthMethods'
      additionalProperties: false
    SetupSession:
      type: object
      required:
        - access_token
        - refresh_token
        - token_type
        - expires_in
        - control_user_id
      properties:
        access_token:
          type: string
          writeOnly: true
        refresh_token:
          type: string
          writeOnly: true
        token_type:
          const: Bearer
        expires_in:
          type: integer
        control_user_id:
          $ref: '#/components/schemas/UUID'
      additionalProperties: false
    SetupCompletion:
      type: object
      required:
        - access_token
        - refresh_token
        - token_type
        - expires_in
        - completed
      properties:
        access_token:
          type: string
          writeOnly: true
        refresh_token:
          type: string
          writeOnly: true
        token_type:
          const: Bearer
        expires_in:
          type: integer
        completed:
          type: boolean
          const: true
      additionalProperties: false
    ChallengeAccepted:
      type: object
      required:
        - challenge_id
        - expires_in
      properties:
        challenge_id:
          $ref: '#/components/schemas/UUID'
        expires_in:
          type: integer
          minimum: 1
      additionalProperties: false
    NotificationQueued:
      type: object
      required:
        - notification_id
        - status
      properties:
        notification_id:
          $ref: '#/components/schemas/UUID'
        status:
          type: string
          const: queued
      additionalProperties: false
    InvitationResent:
      type: object
      required:
        - id
        - last_sent_at
        - resend_available_at
        - expires_at
      properties:
        id:
          $ref: '#/components/schemas/UUID'
        last_sent_at:
          type: string
          format: date-time
        resend_available_at:
          type: string
          format: date-time
        expires_at:
          type: string
          format: date-time
      additionalProperties: false
    ReconciliationAccepted:
      type: object
      required:
        - id
        - provider_id
        - status
      properties:
        id:
          $ref: '#/components/schemas/UUID'
        provider_id:
          $ref: '#/components/schemas/UUID'
        status:
          type: string
          const: pending
      additionalProperties: false
    WebhookTestAccepted:
      type: object
      required:
        - event_id
        - delivery_id
        - status
      properties:
        event_id:
          $ref: '#/components/schemas/UUID'
        delivery_id:
          $ref: '#/components/schemas/UUID'
        status:
          type: string
          const: pending
      additionalProperties: false
    ControlUserAccount:
      type: object
      required:
        - id
        - email
        - display_name
        - status
        - installation_role
        - organizations
        - sign_in_methods
        - created_at
        - updated_at
      properties:
        id:
          $ref: '#/components/schemas/UUID'
        email:
          type: string
          format: email
        display_name:
          type: string
        status:
          enum:
            - active
            - suspended
            - deleted
        installation_role:
          type: [string, 'null']
          enum: [owner, admin, auditor, null]
        organizations:
          type: array
          items:
            type: object
            required: [id, name, role]
            properties:
              id: { $ref: '#/components/schemas/UUID' }
              name: { type: string }
              role: { enum: [owner, admin, member, auditor] }
            additionalProperties: false
        sign_in_methods:
          type: object
          required: [email_code, magic_link, password, external_identities]
          properties:
            email_code: { type: boolean }
            magic_link: { type: boolean }
            password: { type: boolean }
            external_identities:
              type: array
              items:
                type: object
                required: [id, provider, metadata, available, created_at]
                properties:
                  id: { $ref: '#/components/schemas/UUID' }
                  provider: { enum: [google, apple] }
                  metadata: { type: object, additionalProperties: true }
                  available: { type: boolean }
                  created_at: { type: string, format: date-time }
                  last_used_at: { type: [string, 'null'], format: date-time }
                additionalProperties: false
