openapi: 3.1.0
info:
  title: Platform93 API
  version: 0.1.0
  license:
    name: Apache-2.0
    identifier: Apache-2.0
  description: Public contract for fresh Platform93 installations.
servers:
  - url: /
security:
  - bearerAuth: []
tags:
  - name: System
    description: Process health and build information.
  - name: Setup
    description: One-time installation bootstrap.
  - name: Control
    description: Platform users, organizations, and applications.
  - name: Management
    description: Machine-only installation provisioning and organization governance.
  - name: Identity
    description: Application-user authentication and profiles.
  - name: Catalog
    description: Features, products, and immutable prices.
  - name: Entitlements
    description: Grants and local entitlement requests.
  - name: Billing
    description: Provider connections and billing lifecycle.
  - name: Storage
    description: Optional tenant-aware S3-compatible object storage.
  - name: Events
    description: Domain events, outgoing webhooks, and audit.
paths:
  /healthz:
    get:
      operationId: health
      tags:
        - System
      security: []
      responses:
        '200':
          description: Process is alive
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthStatus'
  /readyz:
    get:
      operationId: readiness
      tags:
        - System
      security: []
      responses:
        '200':
          description: Process is ready
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthStatus'
        '503':
          $ref: '#/components/responses/Problem'
  /version:
    get:
      operationId: version
      tags:
        - System
      security: []
      responses:
        '200':
          description: Build information
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VersionInfo'
  /v1/setup/status:
    get:
      operationId: setupStatus
      tags:
        - Setup
      security: []
      responses:
        '200':
          description: Setup and Platform user login availability
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SetupStatus'
  /v1/setup/bootstrap:
    post:
      operationId: bootstrap
      tags:
        - Setup
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BootstrapRequest'
      responses:
        '201':
          description: Setup-only Platform user session
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SetupSession'
        '401':
          $ref: '#/components/responses/Problem'
  /v1/setup/complete:
    post:
      operationId: completeSetup
      tags:
        - Setup
      security:
        - controlBearer: []
        - controlCookie: []
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CompleteSetup'
      responses:
        '200':
          description: Setup completed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SetupCompletion'
        '409':
          $ref: '#/components/responses/Problem'
        '422':
          $ref: '#/components/responses/Problem'
  /v1/setup/notification-providers:
    post:
      operationId: createSetupNotificationProvider
      tags:
        - Setup
      security:
        - controlBearer: []
        - controlCookie: []
      requestBody:
        $ref: '#/components/requestBodies/SMTPProvider'
      responses:
        '201':
          description: Installation SMTP provider stored
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotificationProvider'
  /v1/control/auth/email/start:
    post:
      operationId: startControlUserEmailLogin
      tags:
        - Identity
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ControlEmailStart'
      responses:
        '202':
          description: Enumeration-safe Platform user challenge accepted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChallengeAccepted'
  /v1/control/auth/email/verify:
    post:
      operationId: verifyControlUserEmailLogin
      tags:
        - Identity
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EmailVerify'
      responses:
        '200':
          description: Platform user cookie session created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenResponse'
  /v1/control/auth/password:
    post:
      operationId: loginControlUserWithPassword
      tags:
        - Identity
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ControlUserPasswordLogin'
      responses:
        '200':
          description: Platform user cookie session created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenResponse'
        '401':
          $ref: '#/components/responses/Problem'
    put:
      operationId: changeControlUserPassword
      tags:
        - Identity
      security:
        - controlBearer: []
        - controlCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ControlUserPasswordChange'
      responses:
        '204':
          description: Password stored and other Platform user sessions revoked
        '409':
          $ref: '#/components/responses/Problem'
  /v1/control/auth/me:
    get:
      operationId: getControlUserAccount
      tags:
        - Identity
      security:
        - controlBearer: []
        - controlCookie: []
      responses:
        '200':
          description: Current Platform user profile and sign-in methods
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ControlUserAccount'
    patch:
      operationId: updateControlUserAccount
      tags:
        - Identity
      security:
        - controlBearer: []
        - controlCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateControlUserAccount'
      responses:
        '204':
          description: Platform user profile updated
  /v1/control/auth/logout:
    post:
      operationId: logoutControlUser
      tags:
        - Identity
      security:
        - controlBearer: []
        - controlCookie: []
      responses:
        '204':
          description: Platform user session revoked
  /v1/control/auth/token/refresh:
    post:
      operationId: refreshControlUserSession
      tags:
        - Identity
      security:
        - controlBearer: []
        - controlCookie: []
      responses:
        '200':
          description: Platform user session credential rotated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenResponse'
  /v1/control/auth/sessions:
    get:
      operationId: listControlUserSessions
      tags:
        - Identity
      security:
        - controlBearer: []
        - controlCookie: []
      responses:
        '200':
          description: Successful listControlUserSessions response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionPage'
  /v1/control/auth/sessions/{session_id}:
    parameters:
      - name: session_id
        in: path
        required: true
        schema:
          $ref: '#/components/schemas/UUID'
    delete:
      operationId: revokeControlUserSession
      tags:
        - Identity
      security:
        - controlBearer: []
        - controlCookie: []
      responses:
        '204':
          description: Platform user session revoked
  /v1/control/auth/logout-all:
    post:
      operationId: logoutAllControlUserSessions
      tags:
        - Identity
      security:
        - controlBearer: []
        - controlCookie: []
      responses:
        '204':
          description: All Platform user sessions revoked
  /v1/control/auth/methods:
    get:
      operationId: getControlAuthMethods
      tags:
        - Identity
      security: []
      responses:
        '200':
          description: Available Platform user sign-in methods
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ControlAuthMethods'
  /v1/control/auth/providers/{provider}/start:
    parameters:
      - name: provider
        in: path
        required: true
        schema:
          type: string
          enum:
            - google
            - apple
    post:
      operationId: startControlExternalLogin
      tags:
        - Identity
      security: []
      responses:
        '201':
          description: External Platform sign-in started
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExternalAuthStart'
  /v1/control/auth/providers/{provider}/link:
    parameters:
      - name: provider
        in: path
        required: true
        schema:
          type: string
          enum:
            - google
            - apple
    post:
      operationId: linkControlExternalIdentity
      tags:
        - Identity
      security:
        - controlBearer: []
        - controlCookie: []
      responses:
        '201':
          description: External Platform identity link started
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExternalAuthStart'
  /v1/control/auth/identities/{identity_id}:
    parameters:
      - name: identity_id
        in: path
        required: true
        schema:
          $ref: '#/components/schemas/UUID'
    delete:
      operationId: unlinkControlExternalIdentity
      tags:
        - Identity
      security:
        - controlBearer: []
        - controlCookie: []
      responses:
        '204':
          description: External Platform identity unlinked
        '409':
          $ref: '#/components/responses/Problem'
  /v1/control/invitations/accept:
    post:
      operationId: acceptControlUserInvitation
      tags:
        - Control
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AcceptControlUserInvitation'
      responses:
        '200':
          description: Invitation accepted and Platform user cookie issued
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenResponse'
        '401':
          $ref: '#/components/responses/Problem'
  /v1/control/invitations/providers/{provider}/start:
    parameters:
      - name: provider
        in: path
        required: true
        schema:
          type: string
          enum:
            - google
            - apple
    post:
      operationId: startControlInvitationExternalLogin
      tags:
        - Control
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ControlInvitationProviderStart'
      responses:
        '201':
          description: Provider-backed invitation acceptance started
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExternalAuthStart'
  /v1/control/installation/notification-providers:
    get:
      operationId: listInstallationNotificationProviders
      tags:
        - Setup
      security:
        - controlBearer: []
        - controlCookie: []
      responses:
        '200':
          description: Successful listInstallationNotificationProviders response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotificationProviderPage'
    post:
      operationId: createInstallationNotificationProvider
      tags:
        - Setup
      security:
        - controlBearer: []
        - controlCookie: []
      requestBody:
        $ref: '#/components/requestBodies/SMTPProvider'
      responses:
        '201':
          description: Installation SMTP provider stored
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotificationProvider'
  /v1/control/installation/notification-providers/{provider_id}:
    parameters:
      - name: provider_id
        in: path
        required: true
        schema:
          $ref: '#/components/schemas/UUID'
    get:
      operationId: getInstallationNotificationProvider
      tags:
        - Setup
      security:
        - controlBearer: []
        - controlCookie: []
      responses:
        '200':
          description: Installation notification provider metadata
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotificationProvider'
        '404':
          $ref: '#/components/responses/Problem'
    patch:
      operationId: updateInstallationNotificationProvider
      tags:
        - Setup
      security:
        - controlBearer: []
        - controlCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateSMTPProvider'
      responses:
        '200':
          description: Installation notification provider updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotificationProvider'
        '404':
          $ref: '#/components/responses/Problem'
    delete:
      operationId: disableInstallationNotificationProvider
      tags:
        - Setup
      security:
        - controlBearer: []
        - controlCookie: []
      responses:
        '204':
          description: Installation notification provider disabled
        '404':
          $ref: '#/components/responses/Problem'
  /v1/control/installation/notification-providers/{provider_id}/verify:
    parameters:
      - name: provider_id
        in: path
        required: true
        schema:
          $ref: '#/components/schemas/UUID'
    post:
      operationId: verifyInstallationNotificationProvider
      tags:
        - Setup
      security:
        - controlBearer: []
        - controlCookie: []
      responses:
        '204':
          description: SMTP connectivity and credentials verified
        '502':
          $ref: '#/components/responses/Problem'
  /v1/control/installation/notification-providers/{provider_id}/test:
    parameters:
      - name: provider_id
        in: path
        required: true
        schema:
          $ref: '#/components/schemas/UUID'
      - $ref: '#/components/parameters/IdempotencyKey'
    post:
      operationId: testInstallationNotificationProvider
      tags:
        - Setup
      security:
        - controlBearer: []
        - controlCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TestNotificationProvider'
      responses:
        '202':
          description: Installation SMTP test queued
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotificationQueued'
        '404':
          $ref: '#/components/responses/Problem'
  /v1/control/installation/auth/providers:
    get:
      operationId: listInstallationAuthProviders
      tags:
        - Control
      security:
        - controlBearer: []
        - controlCookie: []
      responses:
        '200':
          description: Successful listInstallationAuthProviders response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthProviderPage'
  /v1/control/installation/auth/providers/{provider}:
    parameters:
      - name: provider
        in: path
        required: true
        schema:
          type: string
          enum:
            - google
            - apple
    put:
      operationId: configureInstallationAuthProvider
      tags:
        - Control
      security:
        - controlBearer: []
        - controlCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ConfigureAuthProvider'
      responses:
        '200':
          description: Installation authentication provider configured
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthProvider'
    patch:
      operationId: updateInstallationAuthProvider
      tags:
        - Control
      security:
        - controlBearer: []
        - controlCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateInstallationAuthProvider'
      responses:
        '204':
          description: Installation authentication provider settings updated
        '404':
          $ref: '#/components/responses/Problem'
    delete:
      operationId: disableInstallationAuthProvider
      tags:
        - Control
      security:
        - controlBearer: []
        - controlCookie: []
      responses:
        '204':
          description: Installation authentication provider disabled
  /v1/control/installation/billing/providers:
    get:
      operationId: listInstallationBillingProviders
      tags:
        - Billing
      security:
        - controlBearer: []
        - controlCookie: []
      responses:
        '200':
          description: Successful listInstallationBillingProviders response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BillingProviderPage'
    post:
      operationId: createInstallationBillingProvider
      tags:
        - Billing
      security:
        - controlBearer: []
        - controlCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateBillingProvider'
      responses:
        '201':
          description: Installation billing provider configured
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BillingProvider'
  /v1/control/installation/billing/providers/{provider_id}:
    parameters:
      - $ref: '#/components/parameters/ProviderID'
    get:
      operationId: getInstallationBillingProvider
      tags:
        - Billing
      security:
        - controlBearer: []
        - controlCookie: []
      responses:
        '200':
          description: Secret-free installation billing provider
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BillingProvider'
    patch:
      operationId: updateInstallationBillingProvider
      tags:
        - Billing
      security:
        - controlBearer: []
        - controlCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateBillingProvider'
      responses:
        '204':
          description: Installation billing provider updated
    delete:
      operationId: disableInstallationBillingProvider
      tags:
        - Billing
      security:
        - controlBearer: []
        - controlCookie: []
      responses:
        '204':
          description: Installation billing provider disabled
  /v1/control/installation/billing/providers/{provider_id}/verify:
    parameters:
      - $ref: '#/components/parameters/ProviderID'
    post:
      operationId: verifyInstallationBillingProvider
      tags:
        - Billing
      security:
        - controlBearer: []
        - controlCookie: []
      responses:
        '204':
          description: Installation billing provider credentials verified
  /v1/control/installation/users:
    get:
      operationId: listInstallationControlUsers
      tags:
        - Control
      security:
        - controlBearer: []
        - controlCookie: []
      responses:
        '200':
          description: Successful listInstallationControlUsers response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ControlUserPage'
  /v1/control/installation/users/{control_user_id}:
    parameters:
      - name: control_user_id
        in: path
        required: true
        schema:
          $ref: '#/components/schemas/UUID'
    patch:
      operationId: updateInstallationControlUser
      tags:
        - Control
      security:
        - controlBearer: []
        - controlCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MembershipRole'
      responses:
        '204':
          description: Installation role updated
    delete:
      operationId: deleteInstallationControlUser
      tags:
        - Control
      security:
        - controlBearer: []
        - controlCookie: []
      responses:
        '204':
          description: Installation role removed and sessions revoked
  /v1/control/installation/invitations:
    get:
      operationId: listInstallationControlUserInvitations
      tags:
        - Control
      security:
        - controlBearer: []
        - controlCookie: []
      responses:
        '200':
          description: Successful listInstallationControlUserInvitations response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ControlUserInvitationPage'
    post:
      operationId: createInstallationControlUserInvitation
      tags:
        - Control
      security:
        - controlBearer: []
        - controlCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateControlUserInvitation'
      responses:
        '201':
          description: Platform user invitation created and credential returned once
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ControlUserInvitation'
  /v1/control/installation/invitations/{invitation_id}/resend:
    parameters:
      - name: invitation_id
        in: path
        required: true
        schema:
          $ref: '#/components/schemas/UUID'
    post:
      operationId: resendInstallationControlUserInvitation
      tags:
        - Control
      security:
        - controlBearer: []
        - controlCookie: []
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateControlInvitationMethod'
      responses:
        '200':
          description: Platform user invitation rotated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ControlUserInvitation'
  /v1/control/installation/invitations/{invitation_id}:
    parameters:
      - name: invitation_id
        in: path
        required: true
        schema:
          $ref: '#/components/schemas/UUID'
    delete:
      operationId: revokeInstallationControlUserInvitation
      tags:
        - Control
      security:
        - controlBearer: []
        - controlCookie: []
      responses:
        '204':
          description: Platform user invitation revoked
  /v1/control/installation/auth-policy:
    get:
      operationId: getControlAuthPolicy
      tags:
        - Identity
      security:
        - controlBearer: []
        - controlCookie: []
      responses:
        '200':
          description: Platform authentication policy
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ControlAuthPolicy'
    patch:
      operationId: updateControlAuthPolicy
      tags:
        - Identity
      security:
        - controlBearer: []
        - controlCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateControlAuthPolicy'
      responses:
        '204':
          description: Platform authentication policy updated
        '409':
          $ref: '#/components/responses/Problem'
  /v1/control/installation/signing-keys:
    get:
      operationId: listSigningKeys
      tags:
        - Control
      security:
        - controlBearer: []
        - controlCookie: []
      responses:
        '200':
          description: Successful listSigningKeys response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SigningKeyPage'
  /v1/control/installation/signing-keys/rotate:
    post:
      operationId: rotateSigningKey
      tags:
        - Control
      security:
        - controlBearer: []
        - controlCookie: []
      responses:
        '201':
          description: New installation signing key activated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SigningKey'
  /v1/control/installation/management-api:
    get:
      operationId: getManagementAPIStatus
      tags:
        - Management
      security:
        - controlBearer: []
        - controlCookie: []
      responses:
        '200':
          description: Management API installation status
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ManagementAPIStatus'
    patch:
      operationId: updateManagementAPIStatus
      tags:
        - Management
      security:
        - controlBearer: []
        - controlCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateManagementAPI'
      responses:
        '200':
          description: Management API status updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ManagementAPIStatus'
  /v1/control/installation/management-clients:
    get:
      operationId: listManagementClients
      tags:
        - Management
      security:
        - controlBearer: []
        - controlCookie: []
      responses:
        '200':
          description: Successful listManagementClients response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ManagementClientPage'
    post:
      operationId: createManagementClient
      tags:
        - Management
      security:
        - controlBearer: []
        - controlCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateManagementClient'
      responses:
        '201':
          description: Management client created and secret returned once
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ManagementClient'
        '409':
          $ref: '#/components/responses/Problem'
  /v1/control/installation/management-clients/{management_client_id}/rotate-secret:
    parameters:
      - name: management_client_id
        in: path
        required: true
        schema:
          $ref: '#/components/schemas/UUID'
    post:
      operationId: rotateManagementClientSecret
      tags:
        - Management
      security:
        - controlBearer: []
        - controlCookie: []
      responses:
        '200':
          description: Management client secret rotated and returned once
          content:
            application/json:
