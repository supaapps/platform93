  /v1/management/organizations/{organization_id}/restore:
    parameters:
      - $ref: '#/components/parameters/OrganizationID'
    post:
      operationId: managementRestoreOrganization
      tags:
        - Management
      security:
        - managementBearer: []
      responses:
        '204':
          description: Organization restored
  /v1/management/organizations/{organization_id}/policy:
    parameters:
      - $ref: '#/components/parameters/OrganizationID'
    get:
      operationId: managementGetOrganizationPolicy
      tags:
        - Management
      security:
        - managementBearer: []
      responses:
        '200':
          description: Organization policy and usage
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrganizationPolicy'
    put:
      operationId: managementUpdateOrganizationPolicy
      tags:
        - Management
      security:
        - managementBearer: []
      parameters:
        - $ref: '#/components/parameters/IfMatch'
