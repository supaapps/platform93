        - $ref: '#/components/parameters/IncludeRetired'
      responses:
        '200':
          description: Successful managementListApplications response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApplicationPage'
    post:
      operationId: managementCreateApplication
      tags:
        - Management
      security:
        - managementBearer: []
      requestBody:
        $ref: '#/components/requestBodies/Named'
