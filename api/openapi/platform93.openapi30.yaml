  /oidc/introspect:
    post: { operationId: introspectOIDCToken, tags: [Identity], security: [], requestBody: { $ref: "#/components/requestBodies/OAuthTokenCredential" }, responses: { "200": { description: RFC 7662 token state } } }
  /oidc/userinfo:
    get: { operationId: oidcUserinfo, tags: [Identity], security: [{ bearerAuth: [] }], responses: { "200": { description: OpenID Connect claims }, "401": { $ref: "#/components/responses/Problem" } } }
  /provider-webhooks/stripe/{connection_public_id}:
    post: { operationId: stripeWebhook, tags: [Billing], security: [], parameters: [{ name: connection_public_id, in: path, required: true, schema: { type: string } }, { name: Stripe-Signature, in: header, required: true, schema: { type: string } }], requestBody: { required: true, content: { application/json: { schema: {} } } }, responses: { "200": { description: Event stored and processed }, "400": { $ref: "#/components/responses/Problem" } } }
  /v1/management/organizations:
    get: { operationId: managementListOrganizations, tags: [Management], security: [{ managementBearer: [] }], parameters: [{ $ref: "#/components/parameters/IncludeRetired" }], responses: { "200": { $ref: "#/components/responses/Page" } } }
    post: { operationId: managementCreateOrganization, tags: [Management], security: [{ managementBearer: [] }], requestBody: { $ref: "#/components/requestBodies/Named" }, responses: { "201": { description: Organization provisioned without an operator membership } } }
  /v1/management/organizations/{organization_id}:
    parameters: [{ $ref: "#/components/parameters/OrganizationID" }]
    get: { operationId: managementGetOrganization, tags: [Management], security: [{ managementBearer: [] }], responses: { "200": { description: Organization details } } }
    patch: { operationId: managementUpdateOrganization, tags: [Management], security: [{ managementBearer: [] }], parameters: [{ $ref: "#/components/parameters/IfMatch" }], requestBody: { $ref: "#/components/requestBodies/Rename" }, responses: { "204": { description: Organization renamed } } }
    delete: { operationId: managementRetireOrganization, tags: [Management], security: [{ managementBearer: [] }], responses: { "204": { description: Organization retired } } }
  /v1/management/organizations/{organization_id}/restore:
    parameters: [{ $ref: "#/components/parameters/OrganizationID" }]
    post: { operationId: managementRestoreOrganization, tags: [Management], security: [{ managementBearer: [] }], responses: { "204": { description: Organization restored } } }
  /v1/management/organizations/{organization_id}/policy:
    parameters: [{ $ref: "#/components/parameters/OrganizationID" }]
    get: { operationId: managementGetOrganizationPolicy, tags: [Management], security: [{ managementBearer: [] }], responses: { "200": { description: Organization policy and usage, content: { application/json: { schema: { $ref: "#/components/schemas/OrganizationPolicy" } } } } } }
    put: { operationId: managementUpdateOrganizationPolicy, tags: [Management], security: [{ managementBearer: [] }], parameters: [{ $ref: "#/components/parameters/IfMatch" }], requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/UpdateOrganizationPolicy" } } } }, responses: { "204": { description: Organization policy updated } } }
  /v1/management/organizations/{organization_id}/applications:
    parameters: [{ $ref: "#/components/parameters/OrganizationID" }]
    get: { operationId: managementListApplications, tags: [Management], security: [{ managementBearer: [] }], parameters: [{ $ref: "#/components/parameters/IncludeRetired" }], responses: { "200": { $ref: "#/components/responses/Page" } } }
    post: { operationId: managementCreateApplication, tags: [Management], security: [{ managementBearer: [] }], requestBody: { $ref: "#/components/requestBodies/Named" }, responses: { "201": { description: Application provisioned }, "409": { $ref: "#/components/responses/Problem" } } }
  /v1/management/organizations/{organization_id}/applications/{application_resource_id}:
    parameters: [{ $ref: "#/components/parameters/OrganizationID" }, { name: application_resource_id, in: path, required: true, schema: { $ref: "#/components/schemas/UUID" } }]
    patch: { operationId: managementUpdateApplication, tags: [Management], security: [{ managementBearer: [] }], parameters: [{ $ref: "#/components/parameters/IfMatch" }], requestBody: { $ref: "#/components/requestBodies/Rename" }, responses: { "204": { description: Application renamed } } }
    delete: { operationId: managementRetireApplication, tags: [Management], security: [{ managementBearer: [] }], responses: { "204": { description: Application retired } } }
  /v1/management/organizations/{organization_id}/applications/{application_resource_id}/restore:
    parameters: [{ $ref: "#/components/parameters/OrganizationID" }, { name: application_resource_id, in: path, required: true, schema: { $ref: "#/components/schemas/UUID" } }]
    post: { operationId: managementRestoreApplication, tags: [Management], security: [{ managementBearer: [] }], responses: { "204": { description: Application restored } } }
components:
  securitySchemes:
    bearerAuth: { type: http, scheme: bearer, bearerFormat: JWT-or-PAT }
    operatorBearer: { type: http, scheme: bearer, bearerFormat: JWT }
    operatorCookie: { type: apiKey, in: cookie, name: p93_operator_access }
    managementBearer: { type: http, scheme: bearer, bearerFormat: Platform93-management-JWT, description: "Short-lived client-credentials token with actor_type=management_client and audience platform93:control." }
  parameters:
    ApplicationID: { name: application_id, in: path, required: true, schema: { $ref: "#/components/schemas/UUID" } }
    WorkspaceIDQuery: { name: workspace_id, in: query, required: false, description: Explicit accessible workspace whose grants are merged with the current user's grants., schema: { $ref: "#/components/schemas/UUID" } }
    OrganizationID: { name: organization_id, in: path, required: true, schema: { $ref: "#/components/schemas/UUID" } }
    IncludeRetired: { name: include_retired, in: query, schema: { type: boolean, default: false } }
    IfMatch: { name: If-Match, in: header, required: true, schema: { type: string }, description: Current resource ETag. }
    IdempotencyKey: { name: Idempotency-Key, in: header, required: false, schema: { type: string, minLength: 8, maxLength: 255 } }
    RequiredIdempotencyKey: { name: Idempotency-Key, in: header, required: true, schema: { type: string, minLength: 8, maxLength: 255 } }
    ProviderID: { name: provider_id, in: path, required: true, schema: { $ref: "#/components/schemas/UUID" } }
    SessionID: { name: session_id, in: path, required: true, schema: { $ref: "#/components/schemas/UUID" } }
    SubscriptionID: { name: subscription_id, in: path, required: true, schema: { $ref: "#/components/schemas/UUID" } }
    PaymentID: { name: payment_id, in: path, required: true, schema: { $ref: "#/components/schemas/UUID" } }
    RequestID: { name: request_id, in: path, required: true, schema: { $ref: "#/components/schemas/UUID" } }
    OAuthClientID: { name: client_id, in: query, required: true, schema: { type: string } }
    OAuthRedirectURI: { name: redirect_uri, in: query, required: true, schema: { type: string, format: uri } }
    OAuthResponseType: { name: response_type, in: query, required: true, schema: { type: string, enum: [code] } }
    OAuthScope: { name: scope, in: query, required: true, schema: { type: string } }
    OAuthState: { name: state, in: query, required: true, schema: { type: string, minLength: 8 } }
    OAuthCodeChallenge: { name: code_challenge, in: query, required: true, schema: { type: string, minLength: 43, maxLength: 128 } }
    OAuthCodeChallengeMethod: { name: code_challenge_method, in: query, required: true, schema: { type: string, enum: [S256] } }
  requestBodies:
    Named: { required: true, content: { application/json: { schema: { type: object, required: [name, slug], properties: { name: { type: string }, slug: { type: string, pattern: "^[a-z][a-z0-9-]{1,62}[a-z0-9]$" } } } } } }
    Rename: { required: true, content: { application/json: { schema: { type: object, required: [name], properties: { name: { type: string, minLength: 1, maxLength: 255 } }, additionalProperties: false } } } }
    Object: { required: true, content: { application/json: { schema: { type: object } } } }
    ProviderInheritance: { required: true, content: { application/json: { schema: { type: object, required: [inheritable], properties: { inheritable: { type: boolean, description: Allow child scopes to resolve this provider. } }, additionalProperties: false } } } }
    ApplicationAuthConfig: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/ApplicationAuthConfig" } } } }
    PublicApplicationConfig: { required: true, content: { application/json: { schema: { type: object, additionalProperties: true, description: "This entire object is returned by the unauthenticated runtime-config endpoint. Secrets are forbidden." } } } }
    InternalApplicationConfig: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/ApplicationInternalConfig" } } } }
    RoleAssignment: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/RoleAssignment" } } } }
    OwnershipTransfer: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/OwnershipTransfer" } } } }
    SMTPProvider: { required: true, content: { application/json: { schema: { type: object, required: [name, host, port, tls_mode, sender_email], properties: { name: { type: string }, host: { type: string }, port: { type: integer, minimum: 1, maximum: 65535 }, username: { type: string }, password: { type: string, writeOnly: true }, tls_mode: { enum: [starttls, implicit_tls] }, sender_email: { type: string, format: email }, sender_name: { type: string }, inheritable: { type: boolean, default: false } } } } } }
    OAuthAuthorizationDecision: { required: true, content: { application/x-www-form-urlencoded: { schema: { type: object, required: [client_id, redirect_uri, response_type, scope, state, code_challenge, code_challenge_method, decision], properties: { client_id: { type: string }, redirect_uri: { type: string, format: uri }, response_type: { type: string, enum: [code] }, scope: { type: string }, state: { type: string }, nonce: { type: string }, code_challenge: { type: string }, code_challenge_method: { type: string, enum: [S256] }, decision: { enum: [grant, deny] } } } } } }
    OAuthToken: { required: true, content: { application/x-www-form-urlencoded: { schema: { type: object, required: [grant_type], properties: { grant_type: { enum: [authorization_code, refresh_token, client_credentials] }, code: { type: string }, redirect_uri: { type: string, format: uri }, code_verifier: { type: string }, refresh_token: { type: string }, client_id: { type: string }, client_secret: { type: string, writeOnly: true }, scope: { type: string } } } } } }
    OAuthTokenCredential: { required: true, content: { application/x-www-form-urlencoded: { schema: { type: object, required: [token], properties: { token: { type: string, writeOnly: true }, token_type_hint: { enum: [access_token, refresh_token] }, client_id: { type: string }, client_secret: { type: string, writeOnly: true } } } } } }
  responses:
    Problem: { description: RFC 9457 problem, content: { application/problem+json: { schema: { $ref: "#/components/schemas/Problem" } } } }
    Page: { description: Cursor page, content: { application/json: { schema: { $ref: "#/components/schemas/Page" } } } }
    Tokens: { description: Rotating user session, content: { application/json: { schema: { $ref: "#/components/schemas/TokenResponse" } } } }
    OwnershipTransferResult: { description: Workspace ownership transferred atomically, content: { application/json: { schema: { $ref: "#/components/schemas/OwnershipTransferResult" } } } }
  schemas:
    ManagementAPIStatus:
      type: object
      required: [enabled, can_manage, active_clients, token_endpoint, api_base]
      properties:
        enabled: { type: boolean }
        can_manage: { type: boolean }
        active_clients: { type: integer, minimum: 0 }
        token_endpoint: { type: string, format: uri }
        api_base: { type: string, format: uri }
      additionalProperties: false
    CreateManagementClient:
      type: object
      required: [client_id, name]
      properties:
        client_id: { type: string, minLength: 1, maxLength: 160 }
        name: { type: string, minLength: 1, maxLength: 200 }
        allowed_scopes: { type: array, items: { type: string, enum: [/management/organizations/*] }, default: [/management/organizations/*] }
      additionalProperties: false
    OrganizationEnabledSettings:
      type: object
      required: [public_registration, password_authentication, passwordless_authentication, personal_api_keys, delegation, organization_provider_overrides, application_provider_overrides, custom_events, webhooks]
      properties:
        public_registration: { type: boolean }
        password_authentication: { type: boolean }
        passwordless_authentication: { type: boolean }
        personal_api_keys: { type: boolean }
        delegation: { type: boolean }
        organization_provider_overrides: { type: boolean }
        application_provider_overrides: { type: boolean }
        custom_events: { type: boolean }
        webhooks: { type: boolean }
      additionalProperties: false
    UpdateOrganizationPolicy:
      type: object
      required: [max_applications, max_users, enabled_settings]
      properties:
        max_applications: { type: integer, nullable: true, minimum: 0, description: Null means unlimited. }
        max_users: { type: integer, nullable: true, minimum: 0, description: Null means unlimited across all applications in the organization. }
        enabled_settings: { $ref: "#/components/schemas/OrganizationEnabledSettings" }
      additionalProperties: false
    OrganizationPolicy:
      allOf:
        - { $ref: "#/components/schemas/UpdateOrganizationPolicy" }
        - type: object
          required: [organization_id, usage, version]
          properties:
            organization_id: { $ref: "#/components/schemas/UUID" }
            usage:
              type: object
              required: [applications, users]
              properties:
                applications: { type: integer, minimum: 0 }
                users: { type: integer, minimum: 0 }
              additionalProperties: false
            version: { type: integer, format: int64, minimum: 1 }
    UUID: { type: string, format: uuid }
    Locale: { type: string, maxLength: 35, description: Canonical BCP 47 language tag such as en, de-CH, or pt-BR. Empty means no user preference. }
    Problem: { type: object, required: [type, title, status, code], properties: { type: { type: string, format: uri-reference }, title: { type: string }, status: { type: integer }, detail: { type: string }, code: { type: string }, request_id: { type: string } } }
    Page: { type: object, required: [items, next_cursor], properties: { items: { type: array, items: {} }, next_cursor: { type: string, nullable: true } } }
    OrganizationPage: { type: object, required: [items, next_cursor, installation_role], properties: { items: { type: array, items: { type: object, additionalProperties: true } }, next_cursor: { type: string, nullable: true }, installation_role: { type: string, nullable: true, enum: [owner, admin, auditor, null], description: The current operator's installation-wide role, or null for organization-only access. } } }
    BootstrapRequest: { type: object, required: [credential, email], properties: { credential: { type: string, writeOnly: true }, email: { type: string, format: email }, display_name: { type: string } } }
    AcceptOrganizationInvitation: { type: object, required: [invitation_token], properties: { invitation_token: { type: string, minLength: 1, writeOnly: true }, display_name: { type: string, maxLength: 200 } }, additionalProperties: false }
    ApplicationFlowConfig: { type: object, required: [oauth_client_id, sign_in_redirect_uri, invitation_redirect_uri], additionalProperties: false, properties: { oauth_client_id: { type: string, minLength: 1 }, sign_in_redirect_uri: { type: string, format: uri }, invitation_redirect_uri: { type: string, format: uri } } }
    ApplicationAuthConfig: { type: object, additionalProperties: false, properties: { flows: { $ref: "#/components/schemas/ApplicationFlowConfig" } } }
    ApplicationInternalConfig: { type: object, additionalProperties: false, properties: { registration_mode: { type: string, enum: [public, invite_only] }, password_enabled: { type: boolean }, passwordless_enabled: { type: boolean }, personal_api_keys_enabled: { type: boolean }, delegation_enabled: { type: boolean } } }
    RuntimeAuthConfig: { type: object, required: [registration_mode, registration_enabled, password_enabled, passwordless_enabled], additionalProperties: false, properties: { registration_mode: { type: string, enum: [public, invite_only] }, registration_enabled: { type: boolean }, password_enabled: { type: boolean }, passwordless_enabled: { type: boolean }, flows: { $ref: "#/components/schemas/ApplicationFlowConfig" } } }
    RuntimeConfig: { type: object, required: [schema_version, api_base, issuer, application_id, public_config, auth], properties: { schema_version: { type: string }, api_base: { type: string, format: uri }, issuer: { type: string, format: uri }, application_id: { $ref: "#/components/schemas/UUID" }, public_config: { type: object, additionalProperties: true }, auth: { $ref: "#/components/schemas/RuntimeAuthConfig" } } }
    PasswordSignIn: { type: object, required: [email, password], properties: { email: { type: string, format: email }, password: { type: string, writeOnly: true, minLength: 12, maxLength: 1024 } } }
