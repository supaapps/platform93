    post: { operationId: decideOIDCAuthorization, tags: [Identity], security: [{ bearerAuth: [] }], requestBody: { $ref: "#/components/requestBodies/OAuthAuthorizationDecision" }, responses: { "200": { description: Headless authorization response containing redirect_to when JSON is requested }, "302": { description: Authorization response redirect } } }
  /oidc/token:
    post: { operationId: exchangeOIDCToken, tags: [Identity], security: [], requestBody: { $ref: "#/components/requestBodies/OAuthToken" }, responses: { "200": { description: OAuth token response }, "400": { description: OAuth error response } } }
  /oidc/revoke:
