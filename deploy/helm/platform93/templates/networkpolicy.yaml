{{- if .Values.networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "platform93.fullname" . }}
  labels:
    {{- include "platform93.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "platform93.selectorLabels" . | nindent 6 }}
  policyTypes: [Ingress, Egress]
  ingress:
    - ports:
        - { protocol: TCP, port: 8093 }
        - { protocol: TCP, port: 9090 }
  egress:
    - ports:
        - { protocol: UDP, port: 53 }
        - { protocol: TCP, port: 53 }
        - { protocol: TCP, port: 443 }
        {{- range .Values.networkPolicy.databasePorts }}
        - { protocol: TCP, port: {{ . }} }
        {{- end }}
        {{- range .Values.networkPolicy.smtpPorts }}
        - { protocol: TCP, port: {{ . }} }
        {{- end }}
        {{- range .Values.networkPolicy.storagePorts }}
        - { protocol: TCP, port: {{ . }} }
        {{- end }}
{{- end }}
