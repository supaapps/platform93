{{- if .Values.networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: platform93
  labels:
    {{- include "platform93.labels" . | nindent 4 }}
spec:
  podSelector: { matchLabels: { app.kubernetes.io/name: platform93 } }
  policyTypes: [Ingress, Egress]
  ingress:
    - ports: [{ protocol: TCP, port: 8093 }]
  egress:
    - ports:
        - { protocol: UDP, port: 53 }
        - { protocol: TCP, port: 53 }
        - { protocol: TCP, port: 443 }
        {{- range .Values.networkPolicy.databasePorts }}
        - { protocol: TCP, port: {{ . }} }
        {{- end }}
        {{- range .Values.networkPolicy.smtpPorts }}
        - { protocol: TCP, port: {{ . }} }
        {{- end }}
{{- end }}
