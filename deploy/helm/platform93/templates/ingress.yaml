{{- if .Values.ingress.enabled }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: platform93
  labels:
    {{- include "platform93.labels" . | nindent 4 }}
  {{- with .Values.ingress.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  ingressClassName: {{ .Values.ingress.className | quote }}
  {{- if .Values.ingress.tlsSecret }}
  tls: [{ hosts: [{{ .Values.ingress.host | quote }}], secretName: {{ .Values.ingress.tlsSecret }} }]
  {{- end }}
  rules:
    - host: {{ .Values.ingress.host | quote }}
      http: { paths: [{ path: /, pathType: Prefix, backend: { service: { name: platform93, port: { name: http } } } }] }
{{- end }}
