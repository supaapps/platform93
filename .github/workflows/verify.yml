name: Verify
on:
  workflow_call:
permissions: { contents: read }
jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env: { POSTGRES_DB: platform93_test, POSTGRES_USER: platform93, POSTGRES_PASSWORD: platform93 }
        ports: ["5432:5432"]
        options: --health-cmd "pg_isready -U platform93 -d platform93_test" --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      PLATFORM93_DATABASE_URL: postgres://platform93:platform93@localhost:5432/platform93_test?sslmode=disable
      PLATFORM93_MASTER_KEY: AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
      PLATFORM93_TEST_S3_ENDPOINT: http://127.0.0.1:9000
      PLATFORM93_TEST_S3_ACCESS_KEY: platform93
      PLATFORM93_TEST_S3_SECRET_KEY: platform93-minio-test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version: "1.25.13", cache: true }
      - run: docker run -d --name platform93-minio -p 9000:9000 -e MINIO_ROOT_USER=platform93 -e MINIO_ROOT_PASSWORD=platform93-minio-test minio/minio:RELEASE.2025-07-23T15-54-02Z server /data
      - run: |
          for _ in $(seq 1 30); do
            curl --fail --silent http://127.0.0.1:9000/minio/health/ready && exit 0
            sleep 1
          done
          docker logs platform93-minio
          exit 1
      - run: test -z "$(gofmt -l cmd internal migrations sdk/go)"
      - run: go vet ./...
      - run: go test -race -coverprofile=coverage.out -count=1 -p 1 ./...
      - name: Prove PostgreSQL and MinIO integration suites executed
        run: |
          go test -json -count=1 ./internal/httpapi ./internal/objectstorage | tee /tmp/integration-tests.json
          jq -e 'select(.Action == "pass" and .Test == "TestWorkspaceOwnershipAndClientScopeInvariants")' /tmp/integration-tests.json >/dev/null
          jq -e 'select(.Action == "pass" and .Test == "TestMinIODirectTransferAndVisibility")' /tmp/integration-tests.json >/dev/null
      - run: go run golang.org/x/vuln/cmd/govulncheck@v1.6.0 ./...
      - run: go run ./cmd/platform93 migrate
      - run: go run github.com/pressly/goose/v3/cmd/goose@v3.24.3 -dir migrations postgres "$PLATFORM93_DATABASE_URL" down
      - run: go run ./cmd/platform93 migrate
      - run: go run ./cmd/platform93 doctor

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 9.13.0 }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm audit --prod --audit-level high
      - run: pnpm --filter @platform93/admin build

  integrations:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with: { php-version: "8.2", tools: "composer:v2" }
      - run: composer validate --strict
      - run: composer install --no-interaction --prefer-dist
      - run: composer audit --no-interaction
      - run: php sdk/php/tests/conformance.php && php sdk/php/tests/auth_conformance.php
      - run: find sdk/php/src -name '*.php' -print0 | xargs -0 -n1 php -l
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - run: python -m pip install --upgrade build pip-audit 'setuptools>=83'
      - run: python -m build sdk/python/auth && python -m build sdk/python/webhooks
      - run: python -m pip install -e sdk/python/auth -e sdk/python/webhooks
      - run: pip-audit
      - run: python -m pip check
      - run: PYTHONPATH=sdk/python/auth/src python sdk/python/auth/tests/conformance.py
      - run: PYTHONPATH=sdk/python/webhooks/src python sdk/python/webhooks/tests/conformance.py

  consumers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version: "1.25.13", cache: true }
      - uses: pnpm/action-setup@v4
        with: { version: 9.13.0 }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - uses: shivammathur/setup-php@v2
        with: { php-version: "8.2", tools: "composer:v2" }
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - run: pnpm install --frozen-lockfile && pnpm build:packages
      - run: python -m pip install build
      - run: bash scripts/test-clean-consumers.sh

  browser:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env: { POSTGRES_DB: platform93_browser, POSTGRES_USER: platform93, POSTGRES_PASSWORD: platform93 }
        ports: ["5432:5432"]
        options: --health-cmd "pg_isready -U platform93 -d platform93_browser" --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      PLATFORM93_DATABASE_URL: postgres://platform93:platform93@localhost:5432/platform93_browser?sslmode=disable
      PLATFORM93_MASTER_KEY: AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
      PLATFORM93_PUBLIC_URL: http://127.0.0.1:8093
      PLATFORM93_ADMIN_ASSETS: web/out
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version: "1.25.13", cache: true }
      - uses: pnpm/action-setup@v4
        with: { version: 9.13.0 }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: go run ./cmd/platform93 migrate
      - run: |
          TOKEN="$(go run ./cmd/platform93 bootstrap)"
          echo "PLATFORM93_BOOTSTRAP_TOKEN=${TOKEN}" >> "$GITHUB_ENV"
      - run: go build -o /tmp/platform93 ./cmd/platform93
      - run: |
          /tmp/platform93 serve >/tmp/platform93.log 2>&1 &
          for _ in $(seq 1 30); do
            curl --fail --silent http://127.0.0.1:8093/readyz && exit 0
            sleep 1
          done
          cat /tmp/platform93.log
          exit 1
      - run: pnpm --dir web exec playwright install --with-deps chromium
      - run: pnpm --dir web test:e2e

  contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - uses: actions/setup-go@v5
        with: { go-version: "1.25.13", cache: true }
      - uses: pnpm/action-setup@v4
        with: { version: 9.13.0 }
      - run: pnpm install --frozen-lockfile
      - run: pnpm generate
      - run: git diff --exit-code
      - run: pnpm exec redocly lint api/openapi/platform93.yaml
      - run: pnpm check:routes && pnpm check:contracts && pnpm check:terminology
      - run: node scripts/validate-event-schema.mjs

  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with: { context: ., push: false, load: true, tags: "platform93:test" }
      - uses: aquasecurity/trivy-action@v0.36.0
        with: { image-ref: "platform93:test", severity: "HIGH,CRITICAL", ignore-unfixed: true, exit-code: "1" }

  deployment:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker compose -f deploy/compose/compose.yaml config --quiet
      - run: docker run --rm -v "$PWD:/work" -w /work alpine/helm:3.17.3 lint deploy/helm/platform93
      - run: |
          docker run --rm -v "$PWD:/work" -w /work alpine/helm:3.17.3 template alpha deploy/helm/platform93 >/tmp/alpha.yaml
          docker run --rm -v "$PWD:/work" -w /work alpine/helm:3.17.3 template beta deploy/helm/platform93 >/tmp/beta.yaml
          ! comm -12 <(awk '/^kind:/{kind=$2}/^  name:/{print kind ":" $2}' /tmp/alpha.yaml | sort) <(awk '/^kind:/{kind=$2}/^  name:/{print kind ":" $2}' /tmp/beta.yaml | sort) | grep .

  helm-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4
        with: { version: v3.17.3 }
      - uses: helm/kind-action@v1.12.0
        with: { cluster_name: platform93 }
      - run: docker build -t platform93:ci . && kind load docker-image platform93:ci --name platform93
      - name: Install Traefik and cert-manager
        run: |
          helm repo add traefik https://traefik.github.io/charts
          helm repo add jetstack https://charts.jetstack.io
          helm repo update
          helm install traefik traefik/traefik --namespace ingress-system --create-namespace --set service.spec.type=ClusterIP --wait --timeout 5m
          helm install cert-manager jetstack/cert-manager --namespace cert-manager --create-namespace --set crds.enabled=true --wait --timeout 5m
          kubectl apply -f - <<'YAML'
          apiVersion: cert-manager.io/v1
          kind: ClusterIssuer
          metadata: { name: platform93-test }
          spec: { selfSigned: {} }
          YAML
      - name: Install external PostgreSQL
        run: |
          kubectl create namespace platform93
          kubectl -n platform93 apply -f - <<'YAML'
          apiVersion: apps/v1
          kind: Deployment
          metadata: { name: postgres }
          spec:
            replicas: 1
            selector: { matchLabels: { app: postgres } }
            template:
              metadata: { labels: { app: postgres } }
              spec:
                containers:
                  - name: postgres
                    image: postgres:16-alpine
                    env:
                      - { name: POSTGRES_USER, value: platform93 }
                      - { name: POSTGRES_PASSWORD, value: platform93 }
                      - { name: POSTGRES_DB, value: platform93_alpha }
                    ports: [{ containerPort: 5432 }]
                    readinessProbe: { exec: { command: [pg_isready, -U, platform93] }, periodSeconds: 2 }
          ---
          apiVersion: v1
          kind: Service
          metadata: { name: postgres }
          spec: { selector: { app: postgres }, ports: [{ port: 5432, targetPort: 5432 }] }
          YAML
          kubectl -n platform93 rollout status deployment/postgres --timeout=3m
          kubectl -n platform93 exec deployment/postgres -- createdb -U platform93 platform93_beta
          kubectl -n platform93 create secret generic alpha-database --from-literal=database-url='postgres://platform93:platform93@postgres:5432/platform93_alpha?sslmode=disable'
          kubectl -n platform93 create secret generic beta-database --from-literal=database-url='postgres://platform93:platform93@postgres:5432/platform93_beta?sslmode=disable'
          kubectl -n platform93 create secret generic alpha-master --from-literal=master-key='AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA='
          kubectl -n platform93 create secret generic beta-master --from-literal=master-key='BBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBB='
      - name: Install, upgrade, roll back, and remove two releases
        run: |
          for release in alpha beta; do
            helm install "$release" deploy/helm/platform93 --namespace platform93 --wait --timeout 5m \
              --set image.repository=platform93 --set image.tag=ci --set image.pullPolicy=Never \
              --set database.existingSecret="${release}-database" --set masterKey.existingSecret="${release}-master" \
              --set publicUrl="https://${release}.platform93.test" --set ingress.enabled=true --set ingress.className=traefik \
              --set ingress.host="${release}.platform93.test" --set ingress.tlsSecret="${release}-tls" \
              --set-string 'ingress.annotations.cert-manager\.io/cluster-issuer=platform93-test'
          done
          kubectl -n platform93 wait --for=condition=ready certificate/alpha-tls certificate/beta-tls --timeout=3m
          kubectl -n platform93 wait --for=condition=available deployment/alpha-platform93-api deployment/beta-platform93-api --timeout=5m
          helm upgrade alpha deploy/helm/platform93 --namespace platform93 --reuse-values --set replicas.worker=1 --wait --timeout 5m
          helm rollback alpha 1 --namespace platform93 --wait --timeout 5m
          kubectl -n platform93 exec deployment/alpha-platform93-api -- /app/platform93 doctor
          helm uninstall alpha --namespace platform93 --wait --timeout 3m
          helm uninstall beta --namespace platform93 --wait --timeout 3m
          kubectl -n platform93 wait --for=delete pod,job -l app.kubernetes.io/name=platform93 --timeout=3m
          ! kubectl -n platform93 get all,configmap,serviceaccount,networkpolicy,pdb -l app.kubernetes.io/name=platform93 --no-headers | grep .

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - run: docker run --rm -v "$PWD:/repo" ghcr.io/gitleaks/gitleaks:v8.30.1 detect --source=/repo --verbose --redact --no-banner
      - run: docker run --rm -v "$PWD:/repo" aquasec/trivy:0.61.1 fs --scanners vuln,secret,misconfig --severity HIGH,CRITICAL --ignore-unfixed --exit-code 1 /repo
      - uses: anchore/sbom-action@v0
        with: { path: ., output-file: sbom.spdx.json }
