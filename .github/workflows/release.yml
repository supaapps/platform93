name: Release
on:
  push: { tags: ["v*.*.*"] }
permissions: { contents: read }
jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env: { POSTGRES_DB: platform93_release, POSTGRES_USER: platform93, POSTGRES_PASSWORD: platform93 }
        ports: ["5432:5432"]
        options: --health-cmd "pg_isready -U platform93 -d platform93_release" --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      PLATFORM93_DATABASE_URL: postgres://platform93:platform93@localhost:5432/platform93_release?sslmode=disable
      PLATFORM93_MASTER_KEY: AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version: "1.25.x", cache: true }
      - uses: pnpm/action-setup@v4
        with: { version: 9.13.0 }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - uses: shivammathur/setup-php@v2
        with: { php-version: "8.2", tools: composer:v2 }
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - run: pnpm install --frozen-lockfile
      - run: pnpm generate && git diff --exit-code
      - run: node scripts/validate-event-schema.mjs && pnpm check:routes
      - run: go vet ./... && go test -race -count=1 -p 1 ./...
      - run: go run ./cmd/platform93 migrate && go run ./cmd/platform93 doctor
      - run: pnpm lint && pnpm test && pnpm typecheck && pnpm --filter @platform93/admin build
      - run: composer validate --strict && composer install --no-interaction --prefer-dist && composer audit --no-interaction
      - run: php sdk/php/tests/conformance.php && php sdk/php/tests/auth_conformance.php
      - run: python -m pip install build 'PyJWT[crypto]>=2.10,<3' 'httpx>=0.28,<1'
      - run: python -m build sdk/python/auth && python -m build sdk/python/webhooks
      - run: PYTHONPATH=sdk/python/auth/src python sdk/python/auth/tests/conformance.py
      - run: PYTHONPATH=sdk/python/webhooks/src python sdk/python/webhooks/tests/conformance.py
      - run: docker compose -f deploy/compose/compose.yaml config --quiet
      - run: docker run --rm -v "$PWD:/work" -w /work alpine/helm:3.17.3 lint deploy/helm/platform93
  artifacts:
    needs: verify
    runs-on: ubuntu-latest
    permissions: { contents: write }
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-go@v5
        with: { go-version: "1.25.x", cache: true }
      - run: |
          VERSION="${GITHUB_REF_NAME#v}"
          BUILD_DATE="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          mkdir -p dist
          for TARGET in linux/amd64 linux/arm64 darwin/amd64 darwin/arm64; do
            TARGET_OS="${TARGET%/*}"
            TARGET_ARCH="${TARGET#*/}"
            GOOS="$TARGET_OS" GOARCH="$TARGET_ARCH" CGO_ENABLED=0 go build -trimpath -ldflags="-s -w -X github.com/supaapps/platform93/internal/buildinfo.Version=${VERSION} -X github.com/supaapps/platform93/internal/buildinfo.Commit=${GITHUB_SHA} -X github.com/supaapps/platform93/internal/buildinfo.Date=${BUILD_DATE}" -o "dist/platform93-${TARGET_OS}-${TARGET_ARCH}" ./cmd/platform93
          done
          cp api/openapi/platform93.yaml dist/platform93-openapi.yaml
          cp schemas/events/envelope.schema.json dist/platform93-event-envelope.schema.json
          cp deploy/compose/compose.yaml dist/platform93-compose.yaml
          sha256sum dist/platform93-* > dist/SHA256SUMS
      - uses: softprops/action-gh-release@v2
        with: { files: "dist/*", generate_release_notes: true }
  image:
    needs: verify
    runs-on: ubuntu-latest
    permissions: { contents: read, packages: write, id-token: write, attestations: write }
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with: { registry: ghcr.io, username: "${{ github.actor }}", password: "${{ secrets.GITHUB_TOKEN }}" }
      - uses: docker/metadata-action@v5
        id: metadata
        with:
          images: ghcr.io/supaapps/platform93
          tags: type=semver,pattern={{version}}
      - uses: docker/build-push-action@v6
        id: build
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.metadata.outputs.tags }}
          labels: ${{ steps.metadata.outputs.labels }}
          provenance: true
          sbom: true
      - uses: sigstore/cosign-installer@v3
      - run: cosign sign --yes ghcr.io/supaapps/platform93@${{ steps.build.outputs.digest }}
  npm:
    needs: verify
    runs-on: ubuntu-latest
    environment: npm
    permissions: { contents: read, id-token: write }
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 9.13.0 }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm, registry-url: "https://registry.npmjs.org" }
      - run: pnpm install --frozen-lockfile && pnpm build:packages
      - run: |
          VERSION="${GITHUB_REF_NAME#v}"
          node scripts/set-release-version.mjs "$VERSION"
          mkdir -p "$RUNNER_TEMP/platform93-npm"
          for PACKAGE in sdk auth react server events; do
            pnpm --dir "sdk/typescript/${PACKAGE}" pack --pack-destination "$RUNNER_TEMP/platform93-npm"
          done
          for TARBALL in "$RUNNER_TEMP"/platform93-npm/*.tgz; do
            npx --yes npm@11.5.1 publish "$TARBALL" --access public --provenance
          done
  pypi:
    needs: verify
    runs-on: ubuntu-latest
    environment: pypi
    permissions: { contents: read, id-token: write }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - run: |
          VERSION="${GITHUB_REF_NAME#v}"
          sed -i "s/^version = .*/version = \"${VERSION}\"/" sdk/python/auth/pyproject.toml sdk/python/webhooks/pyproject.toml
          python -m pip install build
          mkdir -p dist/python
          python -m build --outdir dist/python sdk/python/auth
          python -m build --outdir dist/python sdk/python/webhooks
      - uses: pypa/gh-action-pypi-publish@release/v1
        with: { packages-dir: dist/python }
  helm:
    needs: verify
    runs-on: ubuntu-latest
    permissions: { contents: read, packages: write }
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4
        with: { version: v3.17.3 }
      - run: echo "${{ secrets.GITHUB_TOKEN }}" | helm registry login ghcr.io --username "${{ github.actor }}" --password-stdin
      - run: |
          VERSION="${GITHUB_REF_NAME#v}"
          helm lint deploy/helm/platform93
          helm package deploy/helm/platform93 --version "$VERSION" --app-version "$VERSION" --destination dist
          helm push "dist/platform93-${VERSION}.tgz" oci://ghcr.io/supaapps/charts
