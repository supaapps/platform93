name: Release
on:
  push: { tags: ["v*.*.*"] }
permissions: { contents: read }
jobs:
  verify:
    uses: ./.github/workflows/verify.yml

  security:
    uses: ./.github/workflows/security.yml
    permissions:
      contents: read
      packages: read
      security-events: write

  tag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - run: |
          git fetch origin main
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main || {
            echo "Release tags must reference a commit reachable from origin/main." >&2
            exit 1
          }
          VERSION="${GITHUB_REF_NAME#v}"
          [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]

  artifacts:
    needs: [verify, security, tag, image]
    runs-on: ubuntu-latest
    permissions: { contents: write, packages: read }
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-go@v5
        with: { go-version: "1.25.13", cache: true }
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with: { registry: ghcr.io, username: "${{ github.actor }}", password: "${{ secrets.GITHUB_TOKEN }}" }
      - name: Generate source SBOM
        run: docker run --rm -v "$PWD:/repo" anchore/syft:v1.42.3@sha256:5999d209a342e55e9edf70bf8930fb5b86d8f2a783fa401178372c50e21b1d36 dir:/repo -o spdx-json > "$RUNNER_TEMP/platform93-source.spdx.json"
      - id: build-assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          BUILD_DATE="$(git show -s --format=%cI "$GITHUB_SHA")"
          mkdir -p dist
          for TARGET in linux/amd64 linux/arm64 darwin/amd64 darwin/arm64; do
            TARGET_OS="${TARGET%/*}"
            TARGET_ARCH="${TARGET#*/}"
            GOOS="$TARGET_OS" GOARCH="$TARGET_ARCH" CGO_ENABLED=0 go build -trimpath -ldflags="-s -w -X github.com/supaapps/platform93/internal/buildinfo.Version=${VERSION} -X github.com/supaapps/platform93/internal/buildinfo.Commit=${GITHUB_SHA} -X github.com/supaapps/platform93/internal/buildinfo.Date=${BUILD_DATE}" -o "dist/platform93-${TARGET_OS}-${TARGET_ARCH}" ./cmd/platform93
          done
          cp api/openapi/platform93.yaml dist/platform93-openapi.yaml
          cp schemas/events/*.schema.json dist/
          cp deploy/compose/compose.yaml dist/platform93-compose.yaml
          mv "$RUNNER_TEMP/platform93-source.spdx.json" dist/platform93-source.spdx.json
          jq -e '(.spdxVersion | type == "string" and startswith("SPDX-")) and (.SPDXID == "SPDXRef-DOCUMENT") and (.packages | type == "array")' dist/platform93-source.spdx.json >/dev/null || {
            echo "The generated source SPDX document is missing or invalid." >&2
            exit 1
          }
          IMAGE="ghcr.io/supaapps/platform93:${GITHUB_REF_NAME#v}"
          DIGEST="$(docker buildx imagetools inspect "$IMAGE" --format '{{json .Manifest.Digest}}' | tr -d '"')"
          if [[ ! "$DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo "Unable to resolve a valid OCI image digest for $IMAGE: ${DIGEST:-empty}." >&2
            exit 1
          fi
          docker buildx imagetools inspect "$IMAGE" --format '{{json .Provenance}}' > dist/platform93-image-provenance-attestations.json
          docker buildx imagetools inspect "$IMAGE" --format '{{json .SBOM}}' > dist/platform93-image-sbom-attestations.json
          jq -e 'type == "object" and length > 0' dist/platform93-image-provenance-attestations.json >/dev/null || {
            echo "OCI provenance attestation metadata is missing for $IMAGE." >&2
            exit 1
          }
          jq -e 'type == "object" and length > 0' dist/platform93-image-sbom-attestations.json >/dev/null || {
            echo "OCI SBOM attestation metadata is missing for $IMAGE." >&2
            exit 1
          }
          jq -n \
            --arg image "$IMAGE" \
            --arg digest "$DIGEST" \
            --arg reference "ghcr.io/supaapps/platform93@$DIGEST" \
            --arg revision "$GITHUB_SHA" \
            --arg signature_identity "https://github.com/supaapps/platform93/.github/workflows/release.yml@refs/tags/$GITHUB_REF_NAME" \
            --arg oidc_issuer "https://token.actions.githubusercontent.com" \
            '{image: $image, digest: $digest, reference: $reference, revision: $revision, signature: {identity: $signature_identity, oidc_issuer: $oidc_issuer}, attestation_metadata: {sbom: "platform93-image-sbom-attestations.json", provenance: "platform93-image-provenance-attestations.json"}}' \
            > dist/platform93-oci.json
          (
            cd dist
            find . -maxdepth 1 -type f ! -name SHA256SUMS -print0 | sort -z | xargs -0 sha256sum > "$RUNNER_TEMP/platform93-SHA256SUMS"
            mv "$RUNNER_TEMP/platform93-SHA256SUMS" SHA256SUMS
            sha256sum --check SHA256SUMS
          )
          ALL_PRESENT=false
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            mkdir -p /tmp/platform93-existing-release
            gh release download "$GITHUB_REF_NAME" --dir /tmp/platform93-existing-release
            ALL_PRESENT=true
            for FILE in dist/*; do
              PUBLISHED="/tmp/platform93-existing-release/$(basename "$FILE")"
              if [[ -f "$PUBLISHED" ]]; then
                cmp "$FILE" "$PUBLISHED" || {
                  echo "Published asset $(basename "$FILE") does not match the tagged build." >&2
                  exit 1
                }
              else
                ALL_PRESENT=false
              fi
            done
          fi
          echo "all-present=$ALL_PRESENT" >> "$GITHUB_OUTPUT"
      - uses: softprops/action-gh-release@v2
        if: steps.build-assets.outputs.all-present != 'true'
        with:
          files: "dist/**"
          generate_release_notes: true
          draft: true
          prerelease: ${{ contains(github.ref_name, '-') }}

  image:
    needs: [verify, security, tag]
    runs-on: ubuntu-latest
    permissions: { contents: read, packages: write, id-token: write, attestations: write }
    steps:
      - uses: actions/checkout@v4
      - id: build-info
        run: |
          BUILD_DATE="$(git show -s --format=%cI "$GITHUB_SHA")"
          echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          echo "date=$BUILD_DATE" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with: { registry: ghcr.io, username: "${{ github.actor }}", password: "${{ secrets.GITHUB_TOKEN }}" }
      - uses: imjasonh/setup-crane@v0.4
      - id: existing
        run: |
          IMAGE="ghcr.io/supaapps/platform93:${GITHUB_REF_NAME#v}"
          if crane manifest "$IMAGE" >/dev/null 2>&1; then
            REVISION="$(crane config "$IMAGE" | jq -r '.config.Labels["org.opencontainers.image.revision"] // empty')"
            test "$REVISION" = "$GITHUB_SHA" || {
              echo "Existing image tag belongs to ${REVISION:-an unknown commit}, not $GITHUB_SHA." >&2
              exit 1
            }
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi
      - uses: docker/metadata-action@v5
        id: metadata
        with:
          images: ghcr.io/supaapps/platform93
          tags: type=semver,pattern={{version}}
      - uses: docker/build-push-action@v6
        if: steps.existing.outputs.exists != 'true'
        id: build
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.metadata.outputs.tags }}
          labels: ${{ steps.metadata.outputs.labels }}
          build-args: |
            VERSION=${{ steps.build-info.outputs.version }}
            COMMIT=${{ github.sha }}
            BUILD_DATE=${{ steps.build-info.outputs.date }}
          provenance: true
          sbom: true
      - name: Verify image build metadata
        run: |
          IMAGE="ghcr.io/supaapps/platform93:${GITHUB_REF_NAME#v}"
          EXPECTED="Platform93 ${{ steps.build-info.outputs.version }} (${GITHUB_SHA}, ${{ steps.build-info.outputs.date }})"
          ACTUAL="$(docker run --rm "$IMAGE" version)"
          if [[ "$ACTUAL" != "$EXPECTED" ]]; then
            echo "Image build metadata does not match the tagged commit." >&2
            printf 'Expected: %s\nActual:   %s\n' "$EXPECTED" "$ACTUAL" >&2
            exit 1
          fi
      - uses: sigstore/cosign-installer@v3
      - run: |
          IMAGE="ghcr.io/supaapps/platform93:${GITHUB_REF_NAME#v}"
          DIGEST="$(crane digest "$IMAGE")"
          cosign sign --yes "ghcr.io/supaapps/platform93@${DIGEST}"
      - run: docker run --rm aquasec/trivy:0.61.1 image --severity HIGH,CRITICAL --ignore-unfixed --exit-code 1 "ghcr.io/supaapps/platform93:${GITHUB_REF_NAME#v}"

  npm:
    needs: [verify, security, tag]
    runs-on: ubuntu-latest
    environment: npm
    permissions: { contents: read, id-token: write }
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 9.13.0 }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm, registry-url: "https://registry.npmjs.org" }
      - run: pnpm install --frozen-lockfile && pnpm build:packages
      - run: |
          VERSION="${GITHUB_REF_NAME#v}"
          PUBLISH_TAG="next"
          if [[ "$VERSION" == *-* ]]; then
            PUBLISH_TAG="${VERSION#*-}"
            PUBLISH_TAG="${PUBLISH_TAG%%.*}"
          fi
          node scripts/set-release-version.mjs "$VERSION"
          mkdir -p "$RUNNER_TEMP/platform93-npm"
          for PACKAGE in sdk auth expo react server events; do
            pnpm --dir "sdk/typescript/${PACKAGE}" pack --pack-destination "$RUNNER_TEMP/platform93-npm"
          done
          for TARBALL in "$RUNNER_TEMP"/platform93-npm/*.tgz; do
            NAME="$(tar -xOf "$TARBALL" package/package.json | jq -r .name)"
            LOCAL_INTEGRITY="sha512-$(openssl dgst -sha512 -binary "$TARBALL" | openssl base64 -A)"
            if REMOTE_INTEGRITY="$(npm view "${NAME}@${VERSION}" dist.integrity 2>/dev/null)"; then
              test "$LOCAL_INTEGRITY" = "$REMOTE_INTEGRITY" || {
                echo "Published ${NAME}@${VERSION} does not match the release tarball." >&2
                exit 1
              }
              continue
            fi
            npx --yes npm@11.5.1 publish "$TARBALL" --access public --provenance --tag "$PUBLISH_TAG"
          done

  pypi:
    needs: [verify, security, tag]
    runs-on: ubuntu-latest
    environment: pypi
    permissions: { contents: read, id-token: write }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - run: |
          VERSION="${GITHUB_REF_NAME#v}"
          python -m pip install build packaging
          PY_VERSION="$(python -c "from packaging.version import Version; print(Version('${VERSION}'))")"
          sed -i "s/^version = .*/version = \"${PY_VERSION}\"/" sdk/python/auth/pyproject.toml sdk/python/webhooks/pyproject.toml
          mkdir -p dist/python
          python -m build --outdir dist/python sdk/python/auth
          python -m build --outdir dist/python sdk/python/webhooks
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/python
          skip-existing: true

  helm:
    needs: [verify, security, tag]
    runs-on: ubuntu-latest
    permissions: { contents: read, packages: write }
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4
        with: { version: v3.17.3 }
      - run: echo "${{ secrets.GITHUB_TOKEN }}" | helm registry login ghcr.io --username "${{ github.actor }}" --password-stdin
      - run: |
          VERSION="${GITHUB_REF_NAME#v}"
          helm lint deploy/helm/platform93
          helm package deploy/helm/platform93 --version "$VERSION" --app-version "$VERSION" --destination dist
          if helm pull oci://ghcr.io/supaapps/charts/platform93 --version "$VERSION" --destination /tmp >/dev/null 2>&1; then
            mkdir -p /tmp/current /tmp/published
            tar -xzf "dist/platform93-${VERSION}.tgz" -C /tmp/current
            tar -xzf "/tmp/platform93-${VERSION}.tgz" -C /tmp/published
            diff -ru /tmp/current /tmp/published
          else
            helm push "dist/platform93-${VERSION}.tgz" oci://ghcr.io/supaapps/charts
          fi

  finalize:
    needs: [artifacts, image, npm, pypi, helm]
    runs-on: ubuntu-latest
    permissions: { contents: write, packages: read }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, registry-url: "https://registry.npmjs.org" }
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - uses: azure/setup-helm@v4
        with: { version: v3.17.3 }
      - uses: imjasonh/setup-crane@v0.4
      - run: python -m pip install packaging
      - env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          for PACKAGE in sdk auth expo react server events; do
            NAME="@supaapps/platform93-${PACKAGE}"
            if [[ "$PACKAGE" = sdk ]]; then NAME="@supaapps/platform93-sdk"; fi
            npm view "${NAME}@${VERSION}" version >/dev/null
          done
          python - <<'PY'
          import json, urllib.request
          from packaging.version import Version
          version = str(Version("${{ github.ref_name }}"[1:]))
          for project in ("supaapps-platform93-auth", "supaapps-platform93-webhooks"):
              with urllib.request.urlopen(f"https://pypi.org/pypi/{project}/{version}/json") as response:
                  json.load(response)
          PY
          helm show chart "oci://ghcr.io/supaapps/charts/platform93" --version "$VERSION" >/dev/null
          crane manifest "ghcr.io/supaapps/platform93:${VERSION}" >/dev/null
          gh release download "$GITHUB_REF_NAME" --dir /tmp/release
          (cd /tmp/release && sha256sum --check SHA256SUMS)
          if [[ "$VERSION" != *-* ]]; then
            for PACKAGE in sdk auth expo react server events; do
              NAME="@supaapps/platform93-${PACKAGE}"
              if [[ "$PACKAGE" = sdk ]]; then NAME="@supaapps/platform93-sdk"; fi
              npm dist-tag add "${NAME}@${VERSION}" latest
            done
          fi
          if [[ "$VERSION" == *-* ]]; then
            gh release edit "$GITHUB_REF_NAME" --draft=false --prerelease
          else
            gh release edit "$GITHUB_REF_NAME" --draft=false --prerelease=false --latest
          fi
