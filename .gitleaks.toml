[extend]
useDefault = true

# Exact public compressed-OpenAPI bytes, not credentials. Match both the source
# path and complete value so unrelated generated code remains scanned, including
# after squash/rebase changes the introducing commit's fingerprint.
[[allowlists]]
description = "Verified public embedded OpenAPI values"
condition = "AND"
paths = ['''^internal/generated/openapi\.gen\.go$''']
regexTarget = "secret"
regexes = [
  '''^yDG4fArMIMwK6NnFudYc6jfrqs/MFfomNELzDPLVnPGNb8JzcIb0Gn60O4HMrze85id5cvS3p3979uSb$''',
  '''^dFSo9p0RAipQLOtpQwq0THNqQIFAsRiZcWHIBG4SHQSXwHfoA9a6lnrkiWAShJpagRAGg4TqkOAGw9ff$''',
  '''^s8lkYIuCGcDV1sNjheNSA7nTl9\+eniimy988P7FXtU8IKLl/gKPkGWnmwZsci7dn6wRsL17Myfv8VYm2$''',
  '''^EfxjOkg0qn/MAasipFB4MvJyG0iDDb6zwQwajq9myboUYGF7HhfNHZmsumCvhvhq2sQbEFlJlmOvQ2s\+$''',
  '''^JWS3xN3Lfxncr2ESJFg9i2j\+9pMg78K/ASkNCExjYHzub4XGVU1OwxgCIvDMN08ClTmuPseJGWwyyoJr$''',
  '''^xWKJpfw2VpQnfnk4/OyvOc1Qh7Ry4ibKK7zPyeSe4MMhzx9roaoShMWls0KL7//4/q8AAAD//w==$''',
]

# MD5 of the public foundation template's subject + text + HTML; this guards
# against overwriting customized password-reset templates, not a credential.
[[allowlists]]
description = "Verified public password-reset template content checksum"
condition = "AND"
paths = ['''^migrations/00010_auth_email_delivery\.sql$''']
regexTarget = "secret"
regexes = ['''^630f1f81e1063da7926fc8bb5b03621e$''']
